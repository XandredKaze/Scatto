# Unity Doorstop: carica la mod all'avvio di Cuphead senza BepInEx.
# Per disattivare la mod metti enabled=false (o cancella winhttp.dll).
[General]
enabled=true
target_assembly=CupheadOnlineCoop\CupheadOnlineCoop.dll
redirect_output_log=false
boot_config_override=
ignore_disable_switch=false

[UnityMono]
dll_search_path_override=
debug_enabled=false
debug_address=127.0.0.1:10000
debug_suspend=false

[Il2Cpp]
coreclr_path=
corlib_dir=
