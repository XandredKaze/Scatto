name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  windows-exe:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run exe
      - name: Prova l'eseguibile
        run: .\release\waveobs.exe help
      - uses: actions/upload-artifact@v4
        with:
          name: WaveOBS-windows
          path: release/
      - name: Pacchetto zip per la release
        if: startsWith(github.ref, 'refs/tags/v')
        run: Compress-Archive -Path release\* -DestinationPath WaveOBS-windows.zip
      - name: Pubblica release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: WaveOBS-windows.zip
